name: toy_piecework
description: "玩具厂计件计数与工资结算（离线优先，单管理员版）"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.14.0

dependencies:
  dio: ^5.11.1
  file_picker: ^13.4.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  gal: ^3.0.1
  image: ^4.13.1
  intl: ^0.20.3
  material_ui: ^1.11.1
  path: ^1.9.1
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.6
  uuid: ^4.6.0
  webdav_client: ^1.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.7

# sqflite_common_ffi 仅用于桌面单元测试，它依赖的 package:sqlite3 会通过 build hook
# 下载预编译库。Android 上应用走 sqflite 的平台通道（系统 SQLite），根本不会加载
# package:sqlite3，因此这里让 Android 目标直接使用系统库，避免构建时联网下载。
hooks:
  user_defines:
    sqlite3:
      source:
        android: system
        default: sqlite3

flutter:
  uses-material-design: true
